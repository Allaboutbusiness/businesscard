<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ownerskr — 비율 고정 미리보기</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#0d0f0e}
  /* 실제 홈페이지를 고정 폭(1280)으로 로드 → 화면에 맞춰 통째로 스케일(비율 고정).
     내부 뷰포트가 1280으로 고정이라 확대해도 breakpoint가 안 걸림. 스크롤은 iframe 내부에서. */
  #site{position:absolute;top:0;left:0;border:0;display:block;background:#fff;transform-origin:top left}
  #hint{position:fixed;left:12px;bottom:12px;z-index:9;font:600 12px/1.4 -apple-system,'Malgun Gothic',sans-serif;
    color:#fff;background:rgba(10,110,98,.92);padding:8px 13px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.28);pointer-events:none}
</style></head><body>
<iframe id="site" src="/" title="ownerskr.com" loading="eager"></iframe>
<div id="hint">확대(Ctrl +/−)해도 비율 고정 · 실제 홈페이지</div>
<script>
  (function(){
    var BASE = 1280;                          // 데스크톱 설계 폭(iframe 내부 뷰포트 고정값)
    var f = document.getElementById('site');
    function fit(){
      var s = window.innerWidth / BASE;        // 화면 폭에 맞춰 균일 스케일 → 비율 고정
      f.style.width  = BASE + 'px';
      f.style.height = (window.innerHeight / s) + 'px';  // 스케일 후 화면 높이에 딱 맞게
      f.style.transform = 'scale(' + s + ')';
    }
    window.addEventListener('resize', fit);
    f.addEventListener('load', fit);
    fit();
  })();
</script>
</body></html>
