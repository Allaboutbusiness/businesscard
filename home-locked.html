<!DOCTYPE html><html lang="ko"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>ownerskr — 비율 고정 미리보기</title>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0d0f0e}
  body{overflow-x:hidden}
  /* 실제 홈페이지를 고정 폭으로 로드 → 화면 폭에 맞춰 통째로 스케일(비율 고정) */
  #wrap{position:relative;width:100%;overflow:hidden}
  #site{border:0;display:block;transform-origin:top left;background:#fff}
  #hint{position:fixed;left:12px;bottom:12px;z-index:9;font:600 12px/1.4 -apple-system,'Malgun Gothic',sans-serif;
    color:#fff;background:rgba(10,110,98,.92);padding:8px 13px;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.25);pointer-events:none}
</style></head><body>
<div id="wrap"><iframe id="site" src="/" title="ownerskr.com" scrolling="no" loading="eager"></iframe></div>
<div id="hint">확대(Ctrl +/−)해도 비율 고정 · 실제 홈페이지</div>
<script>
  (function(){
    var BASE = 1280;                         // 데스크톱 기준 설계 폭(내부 뷰포트 고정값)
    var f = document.getElementById('site');
    var wrap = document.getElementById('wrap');
    var lastH = 3000;

    function measure(){
      try{
        var d = f.contentDocument || (f.contentWindow && f.contentWindow.document);
        if(d && d.documentElement){
          var h = Math.max(d.documentElement.scrollHeight, d.body ? d.body.scrollHeight : 0);
          if(h > 400) lastH = h;
        }
      }catch(e){/* 동일 출처라 정상 접근 */}
      return lastH;
    }
    function fit(){
      var s = window.innerWidth / BASE;       // 화면 폭에 맞춰 균일 스케일 → 비율 고정
      var h = measure();
      f.style.width = BASE + 'px';
      f.style.height = h + 'px';
      f.style.transform = 'scale(' + s + ')';
      wrap.style.height = (h * s) + 'px';      // 스케일된 높이만큼 바깥 페이지가 스크롤
    }
    f.addEventListener('load', function(){ fit(); setTimeout(fit, 300); setTimeout(fit, 1200); });
    window.addEventListener('resize', fit);
    setInterval(fit, 900);                      // 내부 콘텐츠 높이 변화(이미지 로드 등) 추적
    fit();
  })();
</script>
</body></html>
